[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hicode"
version = "0.1.0"
description = "Hierarchical inductive coding of text corpora with LLMs"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "datasets==3.3.2",
    "openai==1.63.2",
    "sentence-transformers==3.4.1",
    "tqdm==4.67.1",
    "torch==2.7.1",
    "plotly==6.1.2",
    "streamlit==1.45.1",
]

[project.scripts]
hicode = "hicode.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hicode"]

[dependency-groups]
dev = []
